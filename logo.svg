<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Marble Rush</title>
  <!-- Fond lilas de la charte -->
  <rect width="1024" height="1024" fill="#B79CFF"/>
  <!-- Cible : plateau sombre, anneaux 10 / 20 / 50, trou central -->
  <g transform="translate(556 580)">
    <circle r="392" fill="#1B1530"/>
    <circle r="352" fill="#FFF8EE" stroke="#1B1530" stroke-width="14"/>
    <circle r="262" fill="#FF9ED2" stroke="#1B1530" stroke-width="14"/>
    <circle r="168" fill="#FFF8EE" stroke="#1B1530" stroke-width="14"/>
    <circle r="86" fill="#1B1530"/>
  </g>
  <!-- Deux petites billes des copains posées sur la cible -->
  <g stroke="#1B1530" stroke-width="14">
    <circle cx="742" cy="440" r="58" fill="#5B9BFF"/>
    <circle cx="690" cy="790" r="58" fill="#5ED08F"/>
    <circle cx="400" cy="800" r="58" fill="#FFD23F"/>
  </g>
  <!-- Traînée de vitesse -->
  <g stroke="#1B1530" stroke-width="32" stroke-linecap="round" fill="none">
    <path d="M300 96 L352 150"/>
    <path d="M186 138 L262 222"/>
    <path d="M118 244 L172 300"/>
  </g>
  <!-- La bille : aplat tomate, bande claire, contour épais, symbole éclair -->
  <g transform="translate(372 376)">
    <circle r="172" fill="#1B1530" opacity=".0"/>
    <clipPath id="b"><circle r="160"/></clipPath>
    <circle r="160" fill="#FF6A3D"/>
    <g clip-path="url(#b)"><rect x="-170" y="-170" width="150" height="340" fill="#FF9A78"/></g>
    <circle r="160" fill="none" stroke="#1B1530" stroke-width="24"/>
    <g transform="translate(-100 -100) scale(2.0)"><path d="M57 20L34 54H48L42 80L66 44H52Z" fill="#1B1530"/></g>
  </g>
</svg>
